<title>小釣手水族館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a one-screen toy console. Chunky HUD on top, a framed glass "stage" holding the live scene, big tab buttons for small thumbs. Single bright look on purpose: it is a kids' aquarium toy. */
:root{
  --ink:#123b4a;        /* outlines, text, hard shadows */
  --glass:#eaf8f6;      /* panels */
  --paper:#ffffff;
  --page:#bfe7ee;       /* page ground */
  --bobber:#ff5a4e;     /* primary action, the float */
  --sun:#ffc83a;        /* coins */
  --kelp:#2fae74;       /* success */
  --muted:#4a6d78;
  --r1:#4f8f71; --r2:#2f7fd0; --r3:#8f52d1; --r4:#d18a00;
  --ui:"Huninn","jf open 粉圓 2.0","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --num:"Fredoka","Huninn",ui-rounded,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--page);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--bobber);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

#app{height:100%;max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* HUD */
.hud{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:clamp(18px,4.8vw,25px);letter-spacing:.04em;white-space:nowrap;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.coins{display:flex;align-items:center;gap:6px;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding-block:3px;padding-inline:5px 13px;box-shadow:0 3px 0 var(--ink);font-family:var(--num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.coin-ic{display:inline-block;vertical-align:-5px;width:22px;height:22px;border-radius:50%;background:#ffe58a;border:2.5px solid var(--ink);box-shadow:inset -3px -3px 0 #f0b400;flex:none}
.coins.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.14)}}
.iconbtn{width:42px;height:42px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-family:var(--num);font-weight:700;font-size:20px}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* Stage */
#stage{position:relative;flex:1;min-height:0;border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:#2a9db8;box-shadow:0 5px 0 var(--ink)}
.view{position:absolute;inset:0}
canvas.scene{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;-webkit-touch-callout:none}
.panel{background:var(--glass);overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}

/* Fishing overlays */
.spotbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:2}
.spot{pointer-events:auto;display:flex;align-items:center;gap:4px;font-size:15px;padding-block:5px;padding-inline:12px;border-radius:999px;border:2.5px solid var(--ink);background:rgba(255,255,255,.92);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.spot .num{font-size:13px;font-weight:600;color:var(--muted)}
.spot.locked{background:rgba(222,232,234,.94);color:var(--muted)}
.spot[aria-pressed="true"]{background:var(--ink);color:#fff}
.spot svg{width:13px;height:13px}
.tourhud{position:absolute;left:50%;top:calc(var(--sb,34px) + 18px);transform:translateX(-50%);z-index:2;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;width:max-content;max-width:calc(100% - 24px);background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding-block:5px;padding-inline:14px;font-size:16px}
.tourhud b{font-size:20px}
.tourhud .tt.hot{color:var(--bobber)}
.tourhud .tn{font-size:13.5px;color:var(--muted)}
.combo{position:absolute;left:12px;bottom:14px;z-index:3;display:flex;align-items:baseline;gap:4px;padding-block:3px;padding-inline:12px;border:3px solid var(--ink);border-radius:999px;background:linear-gradient(#ff9a3c,#ff5a4e);color:#fff;box-shadow:0 3px 0 var(--ink);font-size:16px;pointer-events:none}
.combo b{font-family:var(--num);font-size:26px;line-height:1.1}
.combo em{font-style:normal;font-family:var(--num);font-weight:700;font-size:15px;color:#fff3b0}
.combo.bump{animation:comboBump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes comboBump{from{transform:scale(.4)}}
.arcading .combo{display:none}
.touring .hint,.arcading .hint{top:calc(var(--sb,34px) + 72px)}
.archud .cb.hot{color:var(--bobber)}
.archud .fgauge{position:relative;width:90px;height:12px;border:2.5px solid var(--ink);border-radius:999px;background:#eef3f4;overflow:hidden}
.archud .fgauge i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffc83a,#ff5a4e)}
.archud .fgauge.on i{background:linear-gradient(90deg,#ff5a4e,#ffc83a,#2fae74,#2f7fd0,#8f52d1)}
#stage.fever{box-shadow:0 5px 0 var(--ink),0 0 0 4px #ffc83a,0 0 28px 6px rgba(255,200,58,.85)}
.arc-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;white-space:nowrap;font-size:clamp(26px,7vw,44px);color:#fff;background:var(--bobber);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding-block:8px;padding-inline:22px;animation:bannerIn .35s ease-out}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.arc-banner.gold{background:linear-gradient(#ffe27a,#ffb627);color:var(--ink)}
.arc-banner.blue{background:linear-gradient(#8fd0ff,#4f95f0)}
.arc-qte{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;color:#fff;text-shadow:0 0 4px var(--ink),0 0 4px var(--ink),0 0 4px var(--ink)}
.arc-qte svg{width:96px;height:96px;filter:drop-shadow(0 4px 0 var(--ink));animation:qtePulse .3s ease-in-out infinite alternate}
@keyframes qtePulse{to{scale:1.15}}
.tut{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.tut-hand{position:relative;width:76px;height:76px}
.tut-hand svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(18,59,74,.5))}
.tut-hand::before{content:"";position:absolute;left:30px;top:2px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;opacity:0}
.tut.hold .tut-hand{animation:tutPress 1.3s ease-in-out infinite}
.tut.hold .tut-hand::before,.tut.tap .tut-hand::before{animation:tutRing 1.3s ease-out infinite}
.tut.tap .tut-hand{animation:tutTap .45s ease-in-out infinite alternate}
.tut.tap .tut-hand::before{animation-duration:.45s}
.tut.release .tut-hand{animation:tutLift .7s ease-out infinite}
.tut.circle .tut-hand{animation:tutCircle 1s linear infinite}
@keyframes tutPress{0%,100%{transform:translateY(0) scale(1)}25%,80%{transform:translateY(6px) scale(.88)}}
@keyframes tutRing{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
@keyframes tutTap{to{transform:translateY(10px) scale(.9)}}
@keyframes tutLift{from{transform:translateY(8px);opacity:1}to{transform:translateY(-26px);opacity:.2}}
@keyframes tutCircle{from{transform:rotate(0deg) translateX(46px) rotate(0deg)}to{transform:rotate(360deg) translateX(46px) rotate(-360deg)}}
.tut-txt{font-size:clamp(22px,6vw,30px);color:#fff;background:var(--bobber);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding-block:4px;padding-inline:16px;white-space:nowrap}
.tut-skip{pointer-events:auto;font:inherit;font-size:13.5px;color:var(--ink);background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:999px;padding-block:3px;padding-inline:12px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding-block:6px;padding-inline:2px;border:2px solid #c9dadd;border-radius:10px;background:#fff;font-size:12px;color:var(--muted)}
.day b{font-size:15px;color:var(--ink)}
.day small{font-size:10px;line-height:1.2;color:#8f52d1}
.day.got{background:#d5f3e4;border-color:#2fae74}
.day.today{background:var(--sun);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pop{position:absolute;left:0;top:0;z-index:4;pointer-events:none;font-family:var(--num);font-weight:700;font-size:28px;color:#fff;text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 0 3px var(--ink),0 2px 0 var(--ink);animation:popUp 1s ease-out forwards}
.pop.big{font-size:40px;color:#ffc83a}
.pop.miss{font-size:20px;color:#ffd6d2}
@keyframes popUp{to{margin-top:-60px;opacity:0}}
.arc-chip{background:#8f52d1!important;color:#fff!important}
.arc-chip[aria-pressed="true"]{background:var(--bobber)!important}
.tour-chip{background:var(--sun)!important;color:var(--ink)!important}
.scoop-chip{background:#ff7a3c!important;color:#fff!important}
.scoop{position:fixed;inset:0;z-index:15;background:#1d2340;touch-action:none;user-select:none;-webkit-user-select:none}
.scoop canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scoop-hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;z-index:1;pointer-events:none}
.scoop-hud .pill{font-family:var(--num);font-weight:600}
.scoop-hud .btn{margin-left:auto;pointer-events:auto}
.scoop-hud .pill.low{background:#ffd6d2;color:#b3261e}
.tour-chip[aria-pressed="true"]{background:var(--bobber)!important;color:#fff!important}
.reel.boss{border-color:#8a1f2f;box-shadow:0 4px 0 #8a1f2f}
.reel.boss .progress{background:linear-gradient(90deg,#dbe8eb calc(33.3% - 2px),var(--ink) calc(33.3% - 2px) 33.3%,#dbe8eb 33.3% calc(66.6% - 2px),var(--ink) calc(66.6% - 2px) 66.6%,#dbe8eb 66.6%)}
.hint{position:absolute;left:50%;top:calc(var(--sb,34px) + 18px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center;background:rgba(18,59,74,.84);color:#fff;padding-block:6px;padding-inline:14px;border-radius:999px;font-size:16px;pointer-events:none;z-index:2}
.hint.urgent{background:var(--bobber);border:2.5px solid var(--ink);font-size:19px;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}

.bang,.say,.power{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
.bang{width:44px;height:50px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:32px;line-height:1;color:var(--bobber);background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);animation:pop .28s ease-in-out infinite alternate}
@keyframes pop{to{scale:1.14}}
.say{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding-block:5px;padding-inline:12px;font-size:17px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:11px;height:11px;margin-left:-6px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.power{width:18px;height:92px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.power i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--kelp),var(--sun) 60%,var(--bobber))}
.reel{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding-block:10px 12px;padding-inline:12px}
.reel-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;font-size:17px}
.reel-tip{font-size:13px;color:var(--muted)}
.gauge{position:relative;height:32px;border-radius:10px;border:2.5px solid var(--ink);overflow:hidden;background:linear-gradient(90deg,#4fcf8a 0 58%,#ffd44a 58% 84%,#ff5a4e 84%)}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.08) calc(10% - 2px) 10%)}
.needle{position:absolute;top:-3px;bottom:-3px;left:30%;width:13px;margin-left:-6px;background:#fff;border:2.5px solid var(--ink);border-radius:6px;z-index:1}
.gauge-lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;z-index:1;pointer-events:none}
.gauge-lbl.l{left:9px;color:var(--ink)}.gauge-lbl.r{right:9px;color:#fff;text-shadow:0 0 3px var(--ink),0 0 3px var(--ink)}
.reel.danger .gauge{box-shadow:0 0 0 3px rgba(255,90,78,.7)}
.prog-row{display:flex;align-items:center;gap:8px}
.prog-row .progress{flex:1}
.run-tag{font-size:13px;font-weight:700;color:#fff;background:var(--bobber);border:2px solid var(--ink);border-radius:999px;padding-block:2px;padding-inline:9px;white-space:nowrap;animation:pulse2 .4s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.08)}}
.mlist{display:flex;flex-direction:column;gap:8px;text-align:left}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--glass);border-radius:12px;padding-block:8px;padding-inline:12px}
.m.done{background:#d5f3e4}
.m-t{font-size:15.5px}
.m-r{font-family:var(--num);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.m .bar,.lvl .bar{width:auto;max-width:none;height:9px}
.m .bar{grid-column:1/-1}
.lvl{display:flex;align-items:center;gap:10px;font-size:15px}
.lvl .bar{flex:1}
.lvl b{font-family:var(--num);font-size:17px}
.progress{height:14px;border-radius:999px;border:2.5px solid var(--ink);background:#dbe8eb;overflow:hidden}
.progress i{display:block;height:100%;width:35%;border-radius:999px;background:var(--kelp)}

/* Tank overlays */
.tankbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:2}
.pill{background:rgba(255,255,255,.93);border:2.5px solid var(--ink);border-radius:999px;padding-block:5px;padding-inline:13px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.tankbar{align-items:flex-start!important}
.tankbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tankbtns .spot{pointer-events:auto}
.deco-chip{background:#2f9e8f!important;color:#fff!important}
.deco-chip.on{background:#ffc83a!important;color:var(--ink)!important}
#tankHint{top:40%}
.tank-tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center;background:rgba(18,59,74,.72);color:#fff;font-size:13.5px;padding-block:5px;padding-inline:12px;border-radius:999px;pointer-events:none}

/* Panels: dex + shop */
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.panel-head h2{margin:0;font-size:25px;font-weight:400;letter-spacing:.04em}
.dexprog{display:flex;align-items:center;gap:10px;font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;font-size:17px}
.bar{width:150px;max-width:40vw;height:13px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kelp)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:14.5px;padding-block:5px;padding-inline:12px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;cursor:pointer}
.chip .num{font-size:12.5px;margin-left:4px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip[aria-pressed="true"] .num{color:#cfe7ee}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.dex-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0}
.dex-card canvas{width:100%;aspect-ratio:5/3;border-radius:10px;background:linear-gradient(#dff6f8,#b4e2ea)}
.dex-card.unknown canvas{background:linear-gradient(#e7edee,#d0dadd)}
.dex-card.king{border-color:#8a1f2f;box-shadow:0 3px 0 #8a1f2f}
.dex-card.king canvas{background:linear-gradient(#fff3cf,#f6d27a)}
.dex-card.king.unknown canvas{background:linear-gradient(#efe6e8,#d9c9cd)}
.diary-day{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border:2.5px solid var(--ink);border-radius:16px;background:var(--glass)}
.diary-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px}
.diary-fish{display:flex;flex-direction:column;gap:3px;text-align:left;padding:6px;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;min-width:0;font:inherit;color:inherit}
.diary-fish.wide{grid-column:1/-1}
.diary-fish canvas{width:100%;aspect-ratio:5/3;border-radius:8px;background:linear-gradient(#dff6f8,#b4e2ea)}
.diary-fish.wide canvas{aspect-ratio:5/2}
.diary-lbl{font-size:12.5px;color:#8f52d1}
.note-row,.visit-row,.beach-row{grid-column:1/-1;margin:0;padding:8px 12px;border-radius:12px;background:#fffdf0;border:2px solid #e6dcae;font-size:15px;line-height:1.5}
.note-row.unknown,.visit-row.unknown,.beach-row.unknown{color:var(--muted);background:transparent;border-style:dashed;border-color:#c9dadd}
.diary-empty{grid-column:1/-1;margin:0;color:var(--muted)}
.dex-sec{grid-column:1/-1;font-size:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:4px}
.dex-sec small{font-size:13px;color:var(--muted)}
.help-main li{font-size:16.5px}.more{margin-top:10px;text-align:left}.more summary{cursor:pointer;font-weight:700;padding-block:8px;color:var(--ink)}.more ol{font-size:14.5px}
.ach{display:flex;flex-direction:column;align-items:center;gap:5px;padding-block:12px 10px;padding-inline:8px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);text-align:center;min-width:0}
.ach .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:21px;line-height:1;border:3.5px solid var(--ink);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75),rgba(255,255,255,0) 45%),var(--mc,#d9e3e6)}
.ach.bronze .medal{--mc:linear-gradient(135deg,#f8cfa3,#d98a4a)}.ach.silver .medal{--mc:linear-gradient(135deg,#ffffff,#a9b8c1)}.ach.gold .medal{--mc:linear-gradient(135deg,#ffe98f,#f2ad00)}
.ach.locked{background:#f4f8f9;box-shadow:0 3px 0 #9fb3ba;border-color:#9fb3ba}.ach.locked .medal{--mc:#eef3f4;color:#a9bcc2;border:3px dashed #a9bcc2}.ach.locked .an{color:var(--muted)}
.ach .an{font-size:15.5px;font-weight:400}.ach small{font-size:12.5px;color:var(--muted);line-height:1.35}
.ach .bar{width:100%;max-width:none;height:9px}.ach-r{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.dex-card.unknown .dex-name{color:var(--muted)}
.dex-name{font-size:16.5px;padding-inline:2px}
.dex-meta{display:flex;justify-content:space-between;gap:4px;font-size:12.5px;color:var(--muted);padding-inline:2px}
.stars{letter-spacing:1px;white-space:nowrap}
.stars.starin i{display:inline-block;font-style:normal;animation:starPop .45s cubic-bezier(.3,1.7,.5,1) backwards}
.stars.starin i:nth-child(2){animation-delay:.18s}.stars.starin i:nth-child(3){animation-delay:.36s}.stars.starin i:nth-child(4){animation-delay:.54s}
@keyframes starPop{from{transform:scale(0) rotate(-120deg);opacity:0}}
.card.epic{border-color:#c98a00;animation:epicGlow 1.1s ease-in-out infinite alternate}
@keyframes epicGlow{from{box-shadow:0 6px 0 var(--ink),0 0 18px 4px rgba(255,200,60,.55)}to{box-shadow:0 6px 0 var(--ink),0 0 36px 12px rgba(255,214,90,.9)}}
.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}

.equip{font-size:14px;color:var(--muted);margin:-4px 0 14px;line-height:1.6}
.shop-sec{margin-bottom:20px}
.shop-sec h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 8px;font-size:19px;font-weight:400}
.shop-sec h3 small{font-size:13px;color:var(--muted)}
.shop-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:16px;background:#fff}
.item canvas{width:56px;height:56px;border-radius:12px;background:var(--glass)}
.item-name{font-size:16.5px}
.item-desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.status{font-size:13.5px;padding-block:4px;padding-inline:10px;border-radius:999px;background:var(--glass);color:var(--muted);white-space:nowrap}
.status.on{background:#d5f3e4;color:#1d7a50}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:17px;min-height:48px;padding-block:8px;padding-inline:18px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn.primary{background:var(--bobber);color:#fff}
.btn.gold{background:var(--sun)}
.btn.green{background:var(--kelp);color:#fff}
.btn.pink{background:#ff7fa6;color:#fff}
.hearts{color:#ff4f7b;font-size:22px;letter-spacing:2px}.hearts i{font-style:normal;color:#f4b9c8}
.btn.small{font-size:15px;min-height:40px;padding-inline:11px;font-family:var(--num);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn .coin-ic{width:16px;height:16px;border-width:2px;box-shadow:inset -2px -2px 0 #f0b400}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding-block:6px 5px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);font-size:15px;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--bobber);color:#fff}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Modal card */
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:21;pointer-events:none}
.keep{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:16px;background:rgba(9,34,44,.72)}
.keep-box{width:min(420px,100%);max-height:calc(100% - 8px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px}
.keep-box img{width:100%;border-radius:14px;border:2.5px solid var(--ink);-webkit-touch-callout:default}
.keep-box p{margin:0;font-size:14px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(9,34,44,.58)}
.card{width:min(430px,100%);max-height:calc(100% - 8px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:18px}
.card canvas{width:100%;aspect-ratio:26/15;border-radius:16px;background:radial-gradient(ellipse at 50% 40%,#e9fbfd,#a9dfe8)}
.card h2{margin:0;font-size:27px;font-weight:400;letter-spacing:.04em;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.badges:empty{display:none}
.badge{font-size:13.5px;padding-block:3px;padding-inline:11px;border-radius:999px;border:2px solid var(--ink);background:var(--sun)}
.badge.best{background:#a8e8c8}
.badge.rar{background:#fff}
.badge.shiny{background:linear-gradient(90deg,#ffe27a,#ffb347)}
.shiny-tag{color:#d08a00;font-weight:700}
.note label{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
#nickIn{width:12em}
.hatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;width:100%}
.hattile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:3px;font:inherit;font-size:14px;line-height:1.15;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:12px;cursor:pointer}
.hattile canvas{width:38px;height:38px}
.hattile.on{background:#ffe27a;box-shadow:0 0 0 2px #d08a00}
@media (orientation:landscape) and (max-height:520px){.hatgrid{gap:4px}.hattile{flex-direction:row;gap:3px;min-height:44px;padding:1px;font-size:13px}.hattile canvas{width:28px;height:28px;flex:none}}
.note input{font:inherit;font-size:16px;padding-block:6px;padding-inline:10px;border:2.5px solid var(--ink);border-radius:10px;width:9em;max-width:100%;background:#fff;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:16px;color:var(--muted)}
.meta .num{color:var(--ink);font-weight:600}
.meta .coin-ic{margin-inline-end:4px}
.fact{margin:0;text-align:left;font-size:16.5px;line-height:1.65;background:var(--glass);border-radius:14px;padding-block:10px;padding-inline:14px}
.fact ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.note{margin:0;font-size:14.5px;color:var(--muted);white-space:pre-line}
.note:empty{display:none}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));z-index:30;transform:translate(-50%,-14px);opacity:0;max-width:calc(100% - 32px);width:max-content;text-align:center;white-space:pre-line;background:var(--ink);color:#fff;padding-block:10px;padding-inline:16px;border-radius:14px;font-size:16px;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);text-align:center;min-width:0;font:inherit;font-size:15.5px;color:inherit;cursor:pointer}
.stk canvas{width:68px;height:68px}
.stk small{font-size:12.5px;color:var(--muted);line-height:1.35}
.stk.locked{background:#f4f8f9;border-style:dashed;border-color:#9fb3ba;box-shadow:none;color:var(--muted);cursor:default}
.stk.on{background:#fff6cf;box-shadow:0 3px 0 var(--ink),inset 0 0 0 3px var(--sun)}
.stk.wig canvas{animation:stkWig .5s ease}
@keyframes stkWig{25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(12deg) scale(1.1)}}
.fore{margin-top:6px;font-size:14.5px;color:var(--muted);text-align:left}
.fores{display:flex;flex-wrap:wrap;column-gap:18px}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.badge.bingo{background:#ffd0e0}
#mchip{position:relative}#mchip.dot::after{content:'';position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#ff5a4e;border:2px solid #fff}
.bcell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:84px;padding:4px 2px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:13px;line-height:1.2}
.bcell canvas{width:100%;max-width:88px;height:auto;aspect-ratio:25/14}
.bcell b{overflow-wrap:anywhere;text-align:center}.bcell small{font-size:11.5px;color:var(--muted)}.bfree{font-size:30px;line-height:1.1;color:#ffb020}
.bcell.got{background:#eafaf1}.bcell.line{background:#fff3c4}
.bcell.got:not(.free)::after{content:'✓';position:absolute;left:50%;top:38%;width:42px;height:42px;margin:-21px 0 0 -21px;display:grid;place-items:center;border:4px solid rgba(214,51,108,.8);border-radius:50%;color:rgba(214,51,108,.95);background:rgba(255,255,255,.4);font-size:24px;font-weight:900;transform:rotate(-12deg);pointer-events:none}
@media (orientation:landscape) and (max-height:520px){.bcell{flex-direction:row;gap:6px;min-height:0;padding:2px 6px}.bcell canvas{max-width:54px}.bcell small{display:none}.bfree{font-size:22px}.bcell.got:not(.free)::after{left:34px;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;font-size:17px;border-width:3px}}
.cat-peek{position:absolute;left:8px;bottom:36px;width:124px;height:91px;transform:translateY(120%);transition:transform .55s cubic-bezier(.3,1.3,.5,1);cursor:pointer;touch-action:manipulation}
.cat-peek.right{left:auto;right:8px}
.cat-peek.up{transform:translateY(34%)}
.whisper{display:block;width:fit-content;margin:0 0 8px;padding:5px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:14px 14px 14px 4px;font-size:16px;line-height:1.4}
.catf-hud{position:absolute;left:50%;top:calc(var(--sb,34px) + 62px);transform:translateX(-50%);z-index:2;pointer-events:none;width:max-content;max-width:calc(100% - 24px);text-align:center;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding-block:4px;padding-inline:14px;font-size:16px;font-weight:700}
.race-hud{position:absolute;left:8px;right:8px;bottom:10px;z-index:3;display:flex;gap:8px;justify-content:center}
.race-btn{flex:1;max-width:150px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:16px;line-height:1.15;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:4px}
.race-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.race-btn .num{font-size:20px;font-weight:700}
@media (orientation:landscape) and (max-height:520px){.race-hud{right:auto;flex-direction:column;width:124px;gap:5px}.race-btn{flex:none;min-height:44px;flex-direction:row;gap:8px;max-width:none}}
.bolt-fx{position:absolute;inset:0;z-index:1;pointer-events:none;background:#eef6ff;opacity:0}

@media (max-width:420px){
  .brand{gap:6px}
  .brand svg{width:26px;height:26px}
  .brand span{font-size:16px;line-height:1.05;letter-spacing:.02em;white-space:normal;max-width:3.2em}
  .tab{font-size:14px}
  .reel-tip{font-size:12px}
}
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 74px;grid-template-rows:auto minmax(0,1fr);gap:6px 8px;padding-block:6px 8px;padding-inline:max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-right))}
  .hud{grid-column:1/-1}
  #stage{grid-column:1;grid-row:2;border-radius:18px;box-shadow:0 4px 0 var(--ink)}
  .tabs{grid-column:2;grid-row:2;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:6px}
  .tab{justify-content:center;font-size:12.5px;border-radius:14px;padding-block:3px;box-shadow:0 3px 0 var(--ink)}
  .tab svg{width:22px;height:22px}
  .brand{font-size:18px}.brand svg{width:24px;height:24px}
  .coins{font-size:17px;padding-block:1px}
  .iconbtn{width:34px;height:34px;font-size:17px}.iconbtn svg{width:18px;height:18px}
  .card{width:min(640px,100%);padding:14px;gap:8px}
  .card.art{width:min(780px,100%);display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);grid-auto-rows:min-content;align-content:start;column-gap:18px;row-gap:8px}
  .card.art > *{grid-column:2}
  .card.art canvas{grid-column:1;grid-row:1/span 7;align-self:center}
}
@media (pointer:coarse){
  .spot{padding-block:9px;min-height:40px}
}
@media (prefers-reduced-motion:reduce){
  .coins.bump,.hint.urgent,.bang,.run-tag,.arc-banner,.stars.starin i,.card.epic,.combo.bump,.arc-qte svg,.tut-hand,.tut-hand::before{animation:none!important}
  .pop{animation:none}
  .toast{transition:none}
}
/* small screens: the buttons of a tall card stay in view while the rest scrolls; cards are set tighter */
.card .actions{position:sticky;bottom:-18px;z-index:1;background:var(--paper);padding-block:8px;margin-block:-8px}
.card h2{overflow-wrap:anywhere}
.shop-list{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.arc-banner{white-space:normal;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.2}
@media (orientation:portrait) and (max-height:620px){
  .card{gap:8px;padding:14px}
  .card .actions{bottom:-14px}
  .card h2{font-size:23px}
  .card canvas{aspect-ratio:26/11}
  .fact{font-size:15px;line-height:1.5;padding-block:8px;padding-inline:12px}
  .fact ol{gap:3px}
  .note{font-size:13.5px}
}
@media (orientation:landscape) and (max-height:520px){
  .card{width:min(800px,100%);padding:10px 14px;gap:6px}
  .card .actions{bottom:-10px}
  .card.art{width:min(880px,100%);grid-template-columns:minmax(0,34%) minmax(0,1fr)}
  .card h2{font-size:22px}
  .fact{font-size:14.5px;line-height:1.4;padding-block:6px;padding-inline:12px}
  .fact ol{gap:2px}
  .note{font-size:13px;line-height:1.3}
  .btn{min-height:40px}
  .mlist{gap:4px}
  .mlist .m{padding-block:3px}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><line x1="16" y1="1.5" x2="16" y2="8" stroke="#123b4a" stroke-width="2.6" stroke-linecap="round"/><path d="M6 18a10 10 0 0 1 20 0z" fill="#ff5a4e"/><path d="M6 18a10 10 0 0 0 20 0z" fill="#fff"/><circle cx="16" cy="18" r="10" fill="none" stroke="#123b4a" stroke-width="2.6"/></svg>
      <span>小釣手水族館</span>
    </div>
    <div class="coins" id="coins" title="金幣"><span class="coin-ic" aria-hidden="true"></span><b id="coinTxt">0</b></div>
    <button class="iconbtn" id="helpBtn" type="button" aria-label="怎麼玩">?</button>
    <button class="iconbtn" id="soundBtn" type="button" aria-label="聲音開關"></button>
  </header>

  <main id="stage">
    <section class="view" id="view-fish">
      <canvas class="scene" id="fishCv" tabindex="0" aria-label="釣魚區：按住蓄力，放開拋竿。也可以用空白鍵。"></canvas>
      <canvas class="scene" id="fish3d" tabindex="0" aria-label="3D 釣魚區：按住蓄力，放開拋竿。也可以用空白鍵。" hidden></canvas>
      <div class="bang" id="bang" hidden>!</div>
      <div class="say" id="say" hidden></div>
      <div class="power" id="power" hidden><i id="powerFill"></i></div>
      <div class="spotbar" id="spotbar"></div>
      <div class="tourhud" id="tourHud" hidden></div>
      <div class="tourhud archud" id="arcHud" hidden></div>
      <div class="arc-banner" id="arcBanner" hidden></div>
      <div class="arc-qte" id="arcQte" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 56 34H41v24H23V34H8z" fill="#ffc83a" stroke="#123b4a" stroke-width="4" stroke-linejoin="round"/></svg><span id="arcQteTxt">往上滑！</span></div>
      <div class="hint" id="hint"></div>
      <div class="combo" id="combo" hidden><b id="comboN">2</b><span>連釣</span><em id="comboBonus"></em></div>
      <div class="tut" id="tut" hidden>
        <div class="tut-hand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 30V10a5 5 0 0 1 10 0v16l12 3a5 5 0 0 1 4 6l-3 15a8 8 0 0 1-8 7H31a8 8 0 0 1-6-3l-9-11a4 4 0 0 1 6-5l4 4z" fill="#fff" stroke="#123b4a" stroke-width="3.5" stroke-linejoin="round"/></svg></div>
        <div class="tut-txt" id="tutTxt"></div>
        <button class="tut-skip" id="tutSkip" type="button">跳過教學</button>
      </div>
      <div class="reel" id="reel" hidden>
        <div class="reel-top"><span id="reelTitle"></span><span class="reel-tip" id="reelTip">按住→收線　指針變紅→放手</span></div>
        <div class="gauge"><div class="needle" id="needle"></div><span class="gauge-lbl l">魚線鬆</span><span class="gauge-lbl r">快斷了！</span></div>
        <div class="prog-row"><div class="progress"><i id="prog"></i></div><span class="run-tag" id="runTag" hidden>魚在衝！放手！</span></div>
      </div>
    </section>

    <section class="view" id="view-tank" hidden>
      <canvas class="scene" id="tankCv" aria-label="水族箱：點水面餵魚，點魚看介紹，點金幣泡泡收金幣"></canvas>
      <canvas class="scene" id="tank3d" aria-label="3D 水族箱：點水面餵魚，點魚看介紹，點金幣泡泡收金幣" hidden></canvas>
      <div class="hint" id="tankHint" hidden>水族箱還是空的，去釣魚吧！</div>
      <canvas class="cat-peek" id="catPeek" width="260" height="190" hidden aria-hidden="true"></canvas>
      <div class="tankbar"><span class="pill"><span id="tankName">小魚缸</span>　<b class="num" id="tankCount">0 / 6</b></span><div class="tankbtns"><button class="spot scoop-chip" id="scoopBtn" type="button">出去玩</button><button class="spot deco-chip" id="decoBtn" type="button" hidden>擺裝飾</button><button class="spot" id="decoReset" type="button" hidden>排回原位</button></div></div>
      <div class="tank-tip" id="tankTip">點水面餵飼料・兩隻一樣的魚吃飽會生寶寶・點金幣泡泡收金幣</div>
      <div class="tank-tip" id="decoTip" hidden>拖曳裝飾換位置，放好按「完成」</div>
    </section>

    <section class="view panel" id="view-dex" hidden>
      <div class="panel-head">
        <h2>魚類圖鑑</h2>
        <div class="dexprog"><span id="dexCount">0 / 27</span><div class="bar"><i id="dexBar"></i></div></div>
      </div>
      <div class="chips" id="dexFilter"></div>
      <div class="dex-grid" id="dexGrid"></div>
    </section>

    <section class="view panel" id="view-shop" hidden>
      <div class="panel-head"><h2>釣具店</h2></div>
